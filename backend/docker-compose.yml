services:
  postgres:
    image: postgres:16-alpine
    container_name: audiosync-postgres
    environment:
      POSTGRES_DB: audiosync
      POSTGRES_USER: audiosync
      POSTGRES_PASSWORD: audiosync
    ports:
      - "5432:5432"
    volumes:
      - audiosync-postgres-data:/var/lib/postgresql/data

volumes:
  audiosync-postgres-data:
