spring:
  application:
    name: audiosync-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/audiosync}
    username: ${DB_USERNAME:audiosync}
    password: ${DB_PASSWORD:audiosync}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, not Hibernate.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mbf.audiosync: INFO
